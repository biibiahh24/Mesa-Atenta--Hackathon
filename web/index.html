<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mesa Atenta</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
  <script src="/gestao.js" defer></script>
</head>
<body>
<header>
  <div class="shell top">
    <a class="brand" href="/?mesa=07">Mesa Atenta</a>
    <nav aria-label="Telas de demonstração">
      <a href="/?mesa=07" id="customer-link">Mesa</a>
      <a href="/equipe" id="staff-link">Salão</a>
      <a href="/gestao">Gestão</a>
    </nav>
  </div>
</header>
<main class="shell">
  <p class="context">Bovinu’s · Unidade Augusta · Almoço</p>
  <section id="customer" hidden>
    <h1 id="table-title">Atendimento à mesa</h1>
    <p id="table-area"></p>
    <form id="table-form">
      <label for="table">Número da mesa</label>
      <div class="field"><input id="table" name="mesa" inputmode="numeric" type="number" min="1" max="90" required><button>Abrir mesa</button></div>
    </form>
    <section class="card" id="actions" hidden>
      <h2>Como podemos ajudar?</h2>
      <div class="actions">
        <button data-reason="bebida">Pedir atendimento para bebida</button>
        <button data-reason="atendimento" class="secondary">Chamar atendimento</button>
      </div>
    </section>
  </section>
  <section id="staff" hidden>
    <h1>Painel do salão</h1>
    <p>Atenda primeiro os chamados com maior espera.</p>
    <div class="stats">
      <div><span>Aguardando</span><strong id="waiting">—</strong></div>
      <div><span>Em atendimento</span><strong id="serving">—</strong></div>
      <div><span>Espera média recente</span><strong id="average">—</strong></div>
    </div>
    <label for="area">Filtrar por salão</label>
    <select id="area"><option value="">Todos os salões</option><option>Salão principal</option><option>Salão superior</option><option>Salão inferior</option></select>
  </section>
  <p role="status" id="notice"></p>
  <p role="alert" id="error" hidden></p>
  <section aria-labelledby="list-title">
    <h2 id="list-title">Chamados</h2>
    <ul id="calls" class="calls"></ul>
  </section>
  <section id="cleaning-panel" aria-labelledby="cleaning-title" hidden>
    <h2 id="cleaning-title">Limpeza do salão</h2>
    <form class="card" data-action="sinalizar">
      <label for="clean-table">Número da mesa que precisa de limpeza</label>
      <input id="clean-table" name="table" type="number" min="1" max="90" required>
      <button>Sinalizar mesa</button>
    </form>
    <p role="status" id="operations-status"></p>
    <p role="alert" id="operations-error" hidden></p>
    <ul class="calls" id="cleaning-list"></ul>
  </section>
</main>
</body>
</html>
