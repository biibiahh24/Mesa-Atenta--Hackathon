<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Salão · Mesa Atenta</title>
  <link rel="stylesheet" href="/showcase.css">
  <link rel="stylesheet" href="/operacao.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.2/dist/umd/supabase.min.js" defer></script>
  <script src="/demo.js" defer></script>
  <script src="/app.js" defer></script>
  <script src="/gestao.js" defer></script>
</head>
<body data-role="Salão">
<main class="phone-panel role-panel">
  <header><h1>Salão</h1><span>Bovinu’s · Augusta</span></header>
  <nav aria-label="Telas da demonstração"><a href="/gestao">Gestão</a><a href="/equipe" aria-current="page">Salão</a><a href="/mesa?mesa=07">Mesa</a></nav>
  <div class="phone-content">
    <p class="role-demo">Demonstração · dados simulados</p>
    <label for="area">Filtrar por salão</label>
    <select id="area"><option value="">Todos os salões</option><option>Salão principal</option><option>Salão superior</option><option>Salão inferior</option></select>
    <dl class="role-stats"><div><dt>Aguardando</dt><dd id="waiting">—</dd></div><div><dt>Em atendimento</dt><dd id="serving">—</dd></div><div><dt>Espera média</dt><dd id="average">—</dd></div></dl>
    <p role="status" id="notice"></p>
    <p role="alert" id="error" hidden></p>
    <section aria-labelledby="list-title">
      <h3 id="list-title">Atendimento à mesa</h3>
      <ul id="calls" class="calls"></ul>
    </section>
    <section id="cleaning-panel" aria-labelledby="cleaning-title">
      <h3 id="cleaning-title">Limpeza do salão</h3>
      <p role="status" id="operations-status"></p>
      <p role="alert" id="operations-error" hidden></p>
      <ul class="calls" id="cleaning-list"></ul>
      <form class="cleaning-form" data-action="sinalizar">
        <label for="clean-table">Sinalizar mesa para limpeza</label>
        <div><input id="clean-table" name="table" type="number" min="1" max="90" inputmode="numeric" placeholder="Nº da mesa" required><button>Sinalizar</button></div>
        <button class="suggestion" type="button" data-sim="limpeza">Carregar sugestão simulada</button>
      </form>
    </section>
  </div>
</main>
</body>
</html>
