<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Cliente · Mesa Atenta</title>
  <link rel="stylesheet" href="/showcase.css">
  <link rel="stylesheet" href="/operacao.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.2/dist/umd/supabase.min.js" defer></script>
  <script src="/demo.js" defer></script>
  <script src="/app.js" defer></script>
</head>
<body data-role="Mesa">
<main class="phone-panel role-panel">
  <header><h1>Cliente</h1><span>Bovinu’s · Augusta</span></header>
  <nav aria-label="Telas da demonstração"><a href="/gestao">Gestão</a><a href="/equipe">Salão</a><a href="/mesa?mesa=07" aria-current="page">Mesa</a></nav>
  <div class="phone-content">
    <p class="role-demo">Demonstração · dados simulados</p>
    <div class="table-label"><span aria-hidden="true">▱</span><strong id="table-title">Identifique sua mesa</strong><small id="table-area"></small></div>
    <form id="table-form" class="cleaning-form" action="/mesa" method="get">
      <label for="table">Número da mesa (1 a 90)</label>
      <div><input id="table" name="mesa" inputmode="numeric" type="number" min="1" max="90" required><button>Abrir</button></div>
    </form>
    <p role="alert" id="error" hidden></p>
    <section id="actions" hidden>
      <h2 class="client-question">Como podemos ajudar?</h2>
      <button class="client-action" data-reason="bebida" type="button"><span aria-hidden="true">♧</span>Pedir atendimento<br>para bebida</button>
      <button class="client-action" data-reason="atendimento" type="button"><span aria-hidden="true">⌒</span>Chamar atendimento</button>
      <div class="client-progress" aria-label="Etapas do chamado">
        <div><i aria-hidden="true">1</i><span>Aguardando</span></div>
        <div><i aria-hidden="true">2</i><span>Em atendimento</span></div>
        <div><i aria-hidden="true">3</i><span>Concluído</span></div>
      </div>
      <p class="client-confirmation" id="client-confirmation" role="status" hidden></p>
      <p id="notice" role="status"></p>
      <h3>Seus chamados</h3>
      <ul id="calls" class="calls"></ul>
    </section>
  </div>
</main>
</body>
</html>
